<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify Remote</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, dark, built to sit inside a Notion dashboard
   IDEA: a little hardware remote: cover, title, transport keys, preset buttons
   PICTURE: the album cover, with its colour washing the card
   COLOUR and TYPE: Notion dark #191919, Spotify green accent, Inter + Plex Mono labels
   LAYOUT: cover left, track + keys right, playlist presets as a scrolling row, device + volume foot */
:root{--bg:#191919;--card:#202020;--ink:#ebebeb;--mute:#9b9b9b;--line:#2f2f2f;--acc:#1ed760;--tint:32,32,32}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.card{height:100%;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:14px;
  background:linear-gradient(160deg,rgba(var(--tint),.55),var(--card) 70%);transition:background .8s}
.now{display:flex;gap:14px;align-items:center}
.art{width:clamp(84px,24vw,128px);aspect-ratio:1;border-radius:8px;object-fit:cover;background:#2a2a2a;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.meta{flex:1;display:flex;flex-direction:column;gap:6px}
.title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:16px;display:flex;align-items:center;cursor:pointer}
.bar i{display:block;height:4px;width:100%;background:#3a3a3a;border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--ink)}
.bar:hover b{background:var(--acc)}
.times{display:flex;justify-content:space-between;font:11px 'IBM Plex Mono',monospace;color:var(--mute);margin-top:-4px}
.keys{display:flex;align-items:center;gap:4px}
.k{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--mute)}
.k:hover{color:var(--ink)}.k.on{color:var(--acc)}
.k.big{width:42px;height:42px;background:var(--ink);color:#111}.k.big:hover{transform:scale(1.05)}
.k svg{width:18px;height:18px;fill:currentColor}.k.big svg{width:20px;height:20px}
.pl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;scrollbar-color:#444 transparent}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:8px;background:rgba(255,255,255,.06);max-width:190px;min-height:40px}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{background:rgba(30,215,96,.18);color:var(--acc)}
.chip img{width:32px;height:32px;border-radius:5px;object-fit:cover;flex:none;background:#333}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.foot{display:flex;align-items:center;gap:10px;margin-top:auto;font:12px 'IBM Plex Mono',monospace;color:var(--mute)}
.dev{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.dev:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.dev svg{width:14px;height:14px;fill:currentColor;flex:none}
.vol{flex:1;display:flex;align-items:center;gap:6px;justify-content:flex-end}
input[type=range]{width:min(120px,100%);accent-color:var(--acc)}
.menu{position:absolute;left:14px;bottom:44px;background:#2a2a2a;border:1px solid var(--line);border-radius:10px;padding:6px;min-width:220px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:5}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px}
.menu button:hover{background:#363636}.menu .on{color:var(--acc)}
.msg{font-size:12px;color:#f0b35a;min-height:0}
.gate{height:100%;display:grid;place-items:center;text-align:center;padding:16px}
.gate h1{font-size:18px;margin:0 0 6px}.gate p{color:var(--mute);margin:0 0 14px;font-size:13px}
.btn{background:var(--acc);color:#0b0b0b;font-weight:700;padding:10px 20px;border-radius:999px;min-height:44px}
.paste{margin-top:14px;display:flex;gap:6px;justify-content:center}
.paste input{background:#2a2a2a;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;font:12px 'IBM Plex Mono',monospace;width:200px}
.ghost{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
textarea{width:100%;height:70px;background:#2a2a2a;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:11px 'IBM Plex Mono',monospace;padding:8px}
[hidden]{display:none!important}
@media (max-height:230px){.pl{display:none}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div id="gate" class="gate" hidden></div>
<div id="app" class="card" hidden>
  <div class="now">
    <img id="art" class="art" alt="" crossorigin="anonymous">
    <div class="meta">
      <div id="title" class="title">Nothing playing</div>
      <div id="artist" class="artist">Pick a playlist below</div>
      <div id="bar" class="bar" title="Seek"><i><b id="fill"></b></i></div>
      <div class="times"><span id="t0">0:00</span><span id="t1">0:00</span></div>
      <div class="keys">
        <button class="k" id="shuf" aria-label="Shuffle"><svg viewBox="0 0 16 16"><path d="M13.15.35a.5.5 0 0 1 .7 0l2 2a.5.5 0 0 1 0 .7l-2 2a.5.5 0 0 1-.7-.7L14.29 3.2h-1.4a3.5 3.5 0 0 0-2.84 1.46L5.8 10.6A4.5 4.5 0 0 1 2.14 12.5H0v-1h2.14a3.5 3.5 0 0 0 2.84-1.46l4.26-5.94A4.5 4.5 0 0 1 12.9 2.2h1.4L13.15 1.05a.5.5 0 0 1 0-.7zM0 2.2h2.14A4.5 4.5 0 0 1 5.8 4.08l.62.87-.61.86-.83-1.16A3.5 3.5 0 0 0 2.14 3.2H0zm9.6 7.86.61-.86.83 1.16a3.5 3.5 0 0 0 2.85 1.46h1.4l-1.15-1.15a.5.5 0 0 1 .7-.7l2 2a.5.5 0 0 1 0 .7l-2 2a.5.5 0 0 1-.7-.7l1.15-1.15h-1.4a4.5 4.5 0 0 1-3.67-1.88z"/></svg></button>
        <button class="k" id="prev" aria-label="Previous"><svg viewBox="0 0 16 16"><path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.75a.7.7 0 0 1 1.05.6v12.6a.7.7 0 0 1-1.05.6L4 9.15v5.15a.7.7 0 0 1-1.4 0V1.7a.7.7 0 0 1 .7-.7"/></svg></button>
        <button class="k big" id="play" aria-label="Play"><svg viewBox="0 0 16 16" id="pico"><path d="M3 1.7v12.6a.7.7 0 0 0 1.05.6l10.9-6.3a.7.7 0 0 0 0-1.2L4.05 1.1A.7.7 0 0 0 3 1.7"/></svg></button>
        <button class="k" id="next" aria-label="Next"><svg viewBox="0 0 16 16"><path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.1A.7.7 0 0 0 1 1.7v12.6a.7.7 0 0 0 1.05.6L12 9.15v5.15a.7.7 0 0 0 1.4 0V1.7a.7.7 0 0 0-.7-.7"/></svg></button>
        <button class="k" id="open" aria-label="Open in Spotify" title="Open in Spotify"><svg viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.67 11.54a.5.5 0 0 1-.69.17c-1.88-1.15-4.25-1.41-7.04-.77a.5.5 0 1 1-.22-.97c3.05-.7 5.67-.4 7.78.89a.5.5 0 0 1 .17.68m.98-2.18a.62.62 0 0 1-.86.2c-2.15-1.32-5.43-1.7-7.97-.93a.62.62 0 1 1-.36-1.2c2.9-.88 6.52-.45 8.99 1.07a.62.62 0 0 1 .2.86m.08-2.27C10.15 5.56 5.9 5.42 3.44 6.17a.75.75 0 1 1-.43-1.43c2.82-.86 7.52-.69 10.49 1.07a.75.75 0 0 1-.77 1.28"/></svg></button>
      </div>
    </div>
  </div>
  <div id="msg" class="msg"></div>
  <div id="pl" class="pl" aria-label="Your playlists"></div>
  <div class="foot">
    <button class="dev" id="dev"><svg viewBox="0 0 16 16"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h11A1.5 1.5 0 0 1 15 3.5v7a1.5 1.5 0 0 1-1.5 1.5H9v1h2.5a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1H7v-1H2.5A1.5 1.5 0 0 1 1 10.5z"/></svg><span id="devn">No device</span></button>
    <div class="vol"><span>vol</span><input id="vol" type="range" min="0" max="100" value="50" aria-label="Volume"></div>
  </div>
  <div id="menu" class="menu" hidden></div>
</div>
<script>
{
const CLIENT_ID = 'f397762f9a2a485ca321ba549ac885f7';
const REDIRECT = location.origin + location.pathname;
const SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { ms = Math.max(0, ms|0); const s = Math.floor(ms/1000); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rand = n => b64u(crypto.getRandomValues(new Uint8Array(n)));

/* storage: unpartitioned handle if the browser grants it, else plain, else memory */
let saa = null; const mem = {};
const store = {
  get(k){ for (const s of [saa && saa.localStorage, safeLS()]) { try { const v = s && s.getItem(k); if (v) return v; } catch(e){} } return mem[k] || null; },
  set(k,v){ mem[k] = v; for (const s of [saa && saa.localStorage, safeLS()]) { try { s && s.setItem(k,v); } catch(e){} } },
  del(k){ delete mem[k]; for (const s of [saa && saa.localStorage, safeLS()]) { try { s && s.removeItem(k); } catch(e){} } }
};
function safeLS(){ try { return window.localStorage; } catch(e) { return null; } }
async function grabSAA(){
  if (saa || !document.requestStorageAccess) return;
  try { saa = await document.requestStorageAccess({ localStorage: true, BroadcastChannel: true }); } catch(e) {}
}

async function tokenCall(params){
  const r = await fetch('https://accounts.spotify.com/api/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ client_id: CLIENT_ID, ...params }) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.error || 'token error');
  return j;
}
function saveTokens(j){
  store.set('spr_at', j.access_token);
  store.set('spr_exp', String(Date.now() + (j.expires_in - 60) * 1000));
  if (j.refresh_token) store.set('spr_rt', j.refresh_token);
}

/* ---------- callback mode: this window is the login popup ---------- */
const q = new URLSearchParams(location.search);
if (q.get('code') || q.get('error')) {
  (async () => {
    const gate = $('gate'); gate.hidden = false;
    if (q.get('error')) { gate.innerHTML = '<div><h1>Login cancelled</h1><p>You can close this window.</p></div>'; return; }
    try {
      const verifier = (q.get('state') || '').split('.')[1];
      const j = await tokenCall({ grant_type:'authorization_code', code:q.get('code'), redirect_uri:REDIRECT, code_verifier:verifier });
      saveTokens(j);
      const payload = { spr: true, rt: j.refresh_token };
      try { window.opener && window.opener.postMessage(payload, location.origin); } catch(e){}
      try { new BroadcastChannel('spr').postMessage(payload); } catch(e){}
      history.replaceState(null, '', REDIRECT);
      gate.innerHTML = '<div><h1>Connected</h1><p>Your Notion widget should switch over in a second. If it does not, copy this key and paste it into the widget.</p><textarea readonly id="key"></textarea><p style="margin-top:10px"><button class="ghost" id="cp">Copy key</button></p></div>';
      $('key').value = j.refresh_token;
      $('cp').onclick = () => { navigator.clipboard.writeText(j.refresh_token).then(() => $('cp').textContent = 'Copied', () => $('key').select()); };
      setTimeout(() => { try { window.close(); } catch(e){} }, 4000);
    } catch(e) { gate.innerHTML = '<div><h1>Could not connect</h1><p>' + esc(e.message) + '</p></div>'; }
  })();
}

/* ---------- widget mode ---------- */
let state = null, devices = [], playlists = [], lastPoll = 0, polling = null, busy = false;

function showGate(note){
  $('app').hidden = true; const g = $('gate'); g.hidden = false;
  g.innerHTML = '<div><h1>Spotify remote</h1><p>' + esc(note || 'Control the Spotify you already have open, with full songs on Premium.') + '</p>' +
    '<button class="btn" id="go">Connect Spotify</button>' +
    '<div class="paste"><input id="pk" placeholder="or paste key" aria-label="Paste key"><button class="ghost" id="pg">Use</button></div></div>';
  $('go').onclick = login;
  $('pg').onclick = async () => { const v = $('pk').value.trim(); if (!v) return; store.set('spr_rt', v); store.del('spr_at'); store.del('spr_exp'); start(); };
}

async function login(){
  await grabSAA();
  const verifier = rand(48);
  const challenge = b64u(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const url = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    response_type:'code', client_id:CLIENT_ID, scope:SCOPES, redirect_uri:REDIRECT,
    code_challenge_method:'S256', code_challenge:challenge, state: rand(8) + '.' + verifier });
  const w = window.open(url, 'spr_login', 'width=480,height=720');
  if (!w) location.href = url;
  let tries = 0;
  const t = setInterval(() => { if (store.get('spr_rt') || ++tries > 180) { clearInterval(t); if (store.get('spr_rt')) start(); } }, 1000);
}

function listen(){
  const onMsg = d => { if (d && d.spr && d.rt) { store.set('spr_rt', d.rt); store.del('spr_at'); start(); } };
  window.addEventListener('message', e => { if (e.origin === location.origin) onMsg(e.data); });
  try { new BroadcastChannel('spr').onmessage = e => onMsg(e.data); } catch(e){}
  if (saa && saa.BroadcastChannel) { try { new saa.BroadcastChannel('spr').onmessage = e => onMsg(e.data); } catch(e){} }
}

async function token(){
  const at = store.get('spr_at'), exp = +store.get('spr_exp') || 0;
  if (at && Date.now() < exp) return at;
  const rt = store.get('spr_rt'); if (!rt) throw new Error('nologin');
  try { const j = await tokenCall({ grant_type:'refresh_token', refresh_token:rt }); saveTokens(j); return j.access_token; }
  catch(e) { store.del('spr_rt'); store.del('spr_at'); throw new Error('nologin'); }
}

async function api(path, opts = {}, retry = true){
  const r = await fetch('https://api.spotify.com/v1' + path, { ...opts, headers:{ Authorization:'Bearer ' + await token(), 'Content-Type':'application/json' } });
  if (r.status === 401 && retry) { store.del('spr_at'); return api(path, opts, false); }
  if (r.status === 204 || r.status === 202) return null;
  const text = await r.text(); let j = null; try { j = text ? JSON.parse(text) : null; } catch(e) {}
  if (!r.ok) { const err = new Error((j && j.error && j.error.message) || ('HTTP ' + r.status)); err.status = r.status; err.reason = j && j.error && j.error.reason; throw err; }
  return j;
}

function say(t){ $('msg').textContent = t || ''; if (t) setTimeout(() => { if ($('msg').textContent === t) $('msg').textContent = ''; }, 5000); }

async function boot(){
  listen();
  if (CLIENT_ID.startsWith('__')) { showGate('This widget has no Spotify app ID yet.'); $('go').disabled = true; return; }
  if (!store.get('spr_rt')) { await grabSAAQuiet(); }
  store.get('spr_rt') ? start() : showGate();
}
async function grabSAAQuiet(){ try { if (document.hasStorageAccess && await document.hasStorageAccess()) await grabSAA(); } catch(e){} }

async function start(){
  try { await token(); } catch(e) { showGate(); return; }
  $('gate').hidden = true; $('app').hidden = false;
  loadPlaylists(); poll();
  clearInterval(polling); polling = setInterval(() => { if (!document.hidden) poll(); }, 4000);
  requestAnimationFrame(tick);
}

async function loadPlaylists(){
  try {
    const j = await api('/me/playlists?limit=50');
    playlists = (j.items || []).filter(Boolean);
    renderPlaylists();
  } catch(e) { if (e.message === 'nologin') showGate(); }
}
function renderPlaylists(){
  const ctx = state && state.context && state.context.uri;
  $('pl').innerHTML = playlists.map((p, i) => {
    const img = p.images && p.images.length ? p.images[p.images.length - 1].url : '';
    return '<button class="chip' + (p.uri === ctx ? ' on' : '') + '" data-i="' + i + '" title="' + esc(p.name) + '">' +
      (img ? '<img src="' + esc(img) + '" alt="">' : '<img alt="">') + '<span>' + esc(p.name) + '</span></button>';
  }).join('');
}

async function poll(){
  if (busy) return;
  try {
    state = await api('/me/player?additional_types=episode');
    lastPoll = performance.now();
    render();
  } catch(e) { if (e.message === 'nologin') showGate(); }
}

let lastArt = '';
function render(){
  const it = state && state.item;
  $('title').textContent = it ? it.name : 'Nothing playing';
  $('artist').textContent = it ? (it.artists ? it.artists.map(a => a.name).join(', ') : (it.show && it.show.name) || '') : 'Pick a playlist below, or open Spotify on a device';
  const imgs = it && ((it.album && it.album.images) || it.images) || [];
  const src = imgs.length ? imgs[0].url : '';
  if (src !== lastArt) { lastArt = src; if (src) $('art').src = src; else $('art').removeAttribute('src'); }
  $('pico').innerHTML = state && state.is_playing ? '<path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7z"/>' : '<path d="M3 1.7v12.6a.7.7 0 0 0 1.05.6l10.9-6.3a.7.7 0 0 0 0-1.2L4.05 1.1A.7.7 0 0 0 3 1.7"/>';
  $('play').setAttribute('aria-label', state && state.is_playing ? 'Pause' : 'Play');
  $('shuf').classList.toggle('on', !!(state && state.shuffle_state));
  $('devn').textContent = state && state.device ? state.device.name : 'No active device';
  if (state && state.device && state.device.volume_percent != null && document.activeElement !== $('vol')) $('vol').value = state.device.volume_percent;
  $('vol').disabled = !(state && state.device && state.device.supports_volume !== false);
  renderPlaylists();
}

function tick(){
  if (state && state.item) {
    const dur = state.item.duration_ms || 1;
    const pos = Math.min(dur, (state.progress_ms || 0) + (state.is_playing ? performance.now() - lastPoll : 0));
    $('fill').style.width = (pos / dur * 100) + '%';
    $('t0').textContent = fmt(pos); $('t1').textContent = fmt(dur);
  } else { $('fill').style.width = '0'; $('t0').textContent = $('t1').textContent = '0:00'; }
  requestAnimationFrame(tick);
}

$('art').addEventListener('load', () => {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 8;
    const x = c.getContext('2d'); x.drawImage($('art'), 0, 0, 8, 8);
    const d = x.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
    const n = d.length / 4; document.documentElement.style.setProperty('--tint', [r/n|0, g/n|0, b/n|0].join(','));
  } catch(e) {}
});

async function act(fn, after = 350){
  busy = true;
  try { await fn(); }
  catch(e) {
    if (e.message === 'nologin') { showGate(); return; }
    if (e.reason === 'NO_ACTIVE_DEVICE' || e.status === 404) say('Open Spotify on your phone or PC first, then pick it from the device menu.');
    else if (e.reason === 'PREMIUM_REQUIRED') say('Spotify says this needs Premium.');
    else say(e.message);
  }
  finally { busy = false; setTimeout(poll, after); }
}

async function targetDevice(){
  if (state && state.device) return null;
  const j = await api('/me/player/devices'); devices = j.devices || [];
  if (!devices.length) { const e = new Error('none'); e.reason = 'NO_ACTIVE_DEVICE'; throw e; }
  return devices[0].id;
}

$('play').onclick = () => act(async () => {
  if (state && state.is_playing) { state.is_playing = false; render(); await api('/me/player/pause', { method:'PUT' }); }
  else { const id = await targetDevice(); await api('/me/player/play' + (id ? '?device_id=' + encodeURIComponent(id) : ''), { method:'PUT' }); }
});
$('next').onclick = () => act(() => api('/me/player/next', { method:'POST' }), 600);
$('prev').onclick = () => act(() => api('/me/player/previous', { method:'POST' }), 600);
$('shuf').onclick = () => act(() => api('/me/player/shuffle?state=' + !(state && state.shuffle_state), { method:'PUT' }));
$('open').onclick = () => { const u = state && state.item && state.item.external_urls ? state.item.external_urls.spotify : 'https://open.spotify.com'; window.open(u, '_blank', 'noopener'); };
$('bar').onclick = e => {
  if (!(state && state.item)) return;
  const r = e.currentTarget.getBoundingClientRect(); const ms = Math.round((e.clientX - r.left) / r.width * state.item.duration_ms);
  state.progress_ms = ms; lastPoll = performance.now();
  act(() => api('/me/player/seek?position_ms=' + ms, { method:'PUT' }));
};
let vt = null;
$('vol').oninput = e => { clearTimeout(vt); const v = e.target.value; vt = setTimeout(() => act(() => api('/me/player/volume?volume_percent=' + v, { method:'PUT' })), 250); };
$('pl').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const p = playlists[+b.dataset.i]; if (!p) return;
  act(async () => { const id = await targetDevice(); await api('/me/player/play' + (id ? '?device_id=' + encodeURIComponent(id) : ''), { method:'PUT', body: JSON.stringify({ context_uri: p.uri }) }); }, 700);
};
$('dev').onclick = async e => {
  e.stopPropagation();
  const m = $('menu'); if (!m.hidden) { m.hidden = true; return; }
  try { const j = await api('/me/player/devices'); devices = j.devices || []; } catch(err) { devices = []; }
  m.innerHTML = devices.length ? devices.map((d, i) => '<button data-i="' + i + '" class="' + (d.is_active ? 'on' : '') + '">' + esc(d.name) + ' <span style="color:var(--mute)">' + esc(d.type) + '</span></button>').join('')
    : '<button disabled>No devices found. Open Spotify on your phone or PC.</button>';
  m.hidden = false;
};
$('menu').onclick = e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const d = devices[+b.dataset.i]; $('menu').hidden = true;
  act(() => api('/me/player', { method:'PUT', body: JSON.stringify({ device_ids:[d.id], play:true }) }), 900);
};
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('menu').hidden = true; });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').hidden) poll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('menu').hidden = true; });
if (!(q.get('code') || q.get('error'))) boot();
}
</script>
</body>
</html>
